name: Build runtime image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate shell syntax
        run: |
          bash -n docker/entrypoint.sh
          for script in bin/*; do bash -n "$script"; done
          bash -n tests/test-clone-integration.sh

      - name: Run clone and bootstrap unit tests
        run: |
          python3 -m pip install 'PyYAML>=6,<7'
          python3 -m unittest discover -s tests -v
          python3 -m compileall -q clone

      - name: Validate Coolify Compose template
        run: |
          WAREXO_GIT_URL=ssh://dev@example.invalid/repo.git \
          WAREXO_GIT_PRIVATE_KEY=dummy \
          docker compose -f compose.coolify.example.yaml config >/dev/null

      - name: Validate clone Compose template
        env:
          SOURCE_SSH_HOST: source.example.invalid
          SOURCE_SSH_USER: example
          SOURCE_SSH_PRIVATE_KEY: dummy-validation-only
          SOURCE_SSH_KNOWN_HOSTS: dummy-validation-only
          SOURCE_WAREXO_PATH: /srv/warexo
        run: docker compose -f compose.clone.coolify.example.yaml config >/dev/null

  build:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/aggrosoft/warexo-dev-runtime
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build runtime for integration tests
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: warexo-runtime:test
          labels: ${{ steps.meta.outputs.labels }}

      - name: Validate PHP helper
        run: docker run --rm --entrypoint php warexo-runtime:test -l /opt/warexo/clone/source_database.php

      - name: Verify SSH clone lifecycle and isolation
        env:
          WAREXO_RUNTIME_IMAGE: warexo-runtime:test
        run: bash tests/test-clone-integration.sh

      - name: Publish verified image
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag warexo-runtime:test "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"

