services:
  warexo:
    build:
      context: .
    restart: unless-stopped
    environment:
      WAREXO_GIT_URL: "${WAREXO_GIT_URL}"
      WAREXO_GIT_REF: "${WAREXO_GIT_REF:-master}"
      WAREXO_GIT_PRIVATE_KEY: "${WAREXO_GIT_PRIVATE_KEY:-}"
      WAREXO_GIT_KNOWN_HOSTS: "${WAREXO_GIT_KNOWN_HOSTS:-}"

      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: "${DB_NAME:-warexo}"
      DB_USER: "${DB_USER:-warexo}"
      DB_PASSWORD: "${DB_PASSWORD}"

      MAILER_TRANSPORT: "${MAILER_TRANSPORT:-smtp}"
      MAILER_HOST: "${MAILER_HOST:-mailpit}"
      MAILER_USER: "${MAILER_USER:-}"
      MAILER_PASSWORD: "${MAILER_PASSWORD:-}"

      WAREXO_LOCALE: "${WAREXO_LOCALE:-de_DE}"
      WAREXO_SECRET: "${WAREXO_SECRET:-dev-secret-change-me}"
      WAREXO_COOKIE_LIFETIME: "${WAREXO_COOKIE_LIFETIME:-86400}"
      WAREXO_GC_MAX_LIFETIME: "${WAREXO_GC_MAX_LIFETIME:-1440}"
      WAREXO_COOKIE_SECURE: "${WAREXO_COOKIE_SECURE:-true}"

      SSH_AUTHORIZED_KEYS: "${SSH_AUTHORIZED_KEYS:-}"

      WAREXO_SNAPSHOT_URL: "${WAREXO_SNAPSHOT_URL:-}"
      WAREXO_SNAPSHOT_TOKEN: "${WAREXO_SNAPSHOT_TOKEN:-}"
    volumes:
      - warexo-code:/var/www/html
      - warexo-state:/var/lib/warexo
    depends_on:
      db:
        condition: service_healthy
    networks:
      - warexo

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: "${DB_NAME:-warexo}"
      MARIADB_USER: "${DB_USER:-warexo}"
      MARIADB_PASSWORD: "${DB_PASSWORD}"
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - warexo-db:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'mariadb-admin ping -h 127.0.0.1 -u "$$MARIADB_USER" -p"$$MARIADB_PASSWORD" --silent'
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - warexo

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    networks:
      - warexo

volumes:
  warexo-code:
  warexo-state:
  warexo-db:

networks:
  warexo:
