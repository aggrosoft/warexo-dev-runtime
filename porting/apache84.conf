Listen 8084
<VirtualHost *:8084>
    ServerName warexo-porting
    DocumentRoot /workspace/warexo-port/web
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    <Directory /workspace/warexo-port/web>
        AllowOverride All
        Options FollowSymLinks
        Require all granted
    </Directory>

    Alias /__warexo_porting_health /opt/warexo/porting/health.php
    <Directory /opt/warexo/porting>
        AllowOverride None
        Options None
        Require all denied
        <Files health.php>
            Require all granted
        </Files>
    </Directory>

    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/warexo-php84.sock|fcgi://localhost/"
    </FilesMatch>
    <LocationMatch "^/(install|app_dev|restore)(\.php|/|$)">
        Require all denied
    </LocationMatch>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
