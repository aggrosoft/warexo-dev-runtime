    environment:
      PORTING_ALLOWED_HOSTS: github.com api.github.com codeload.github.com raw.githubusercontent.com objects.githubusercontent.com release-assets.githubusercontent.com packagist.org repo.packagist.org getcomposer.org private.fixture.invalid
