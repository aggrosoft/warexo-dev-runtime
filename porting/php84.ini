; This file is scanned only by the separately built PHP 8.4 runtime.
date.timezone = Europe/Berlin
memory_limit = 512M
max_execution_time = 300
upload_max_filesize = 128M
post_max_size = 128M
display_errors = Off
log_errors = On
error_reporting = E_ALL
error_log = /proc/self/fd/2
expose_php = Off
session.name = WAREXO_PORTING_SESSION
session.save_path = /workspace/.runtime/php84/sessions
upload_tmp_dir = /workspace/.runtime/php84/tmp
sys_temp_dir = /workspace/.runtime/php84/tmp
zend_extension = opcache
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
