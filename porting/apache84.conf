Listen 8084
<VirtualHost *:8084>
    ServerName warexo-porting
    # The clean, persistent Next checkout is served directly. Legacy stays on port 80.
    # It may be checked out after the container starts; no image rebuild is needed.
    DocumentRoot /workspace/repos/next/backend/public
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    <Directory /workspace/repos/next/backend/public>
        AllowOverride None
        Options +FollowSymLinks -Indexes
        Require all granted
        DirectoryIndex index.php
        FallbackResource /index.php
    </Directory>

    Alias /__warexo_porting_health /opt/warexo/porting/health.php
    <Directory /opt/warexo/porting>
        AllowOverride None
        Options None
        Require all denied
        <Files health.php>
            Require all granted
        </Files>
    </Directory>

    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/warexo-php84.sock|fcgi://localhost/"
    </FilesMatch>
    <LocationMatch "^/(install|app_dev|restore)(\.php|/|$)">
        Require all denied
    </LocationMatch>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
