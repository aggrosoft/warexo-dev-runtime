services:
  source-db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: source-fixture-password
      MARIADB_ROOT_HOST: '%'
      MARIADB_DATABASE: warexo_source
    volumes:
      - ./source.sql:/docker-entrypoint-initdb.d/source.sql:ro
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 2s
      timeout: 5s
      retries: 60
  source-ssh:
    image: ${WAREXO_TEST_SOURCE_IMAGE:?}
    volumes:
      - ${WAREXO_TEST_TMP:?}:/fixture:ro
    depends_on:
      source-db:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'test -s /run/sshd.pid && kill -0 $$(cat /run/sshd.pid)']
      interval: 2s
      timeout: 3s
      retries: 30
  canary:
    image: nginx:1.28-alpine
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1/']
      interval: 2s
      timeout: 3s
      retries: 30
networks:
  default:
    external: true
    name: ${WAREXO_TEST_NETWORK:?}
