[global]
pid = /run/warexo-php84.pid
error_log = /proc/self/fd/2
daemonize = no

[warexo-porting]
user = developer
group = developer
listen = /run/warexo-php84.sock
listen.owner = developer
listen.group = developer
listen.mode = 0600
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 10s
pm.max_requests = 500
catch_workers_output = yes
decorate_workers_output = no
clear_env = yes
security.limit_extensions = .php
request_terminate_timeout = 300s
; Subprocesses started through plain `php` use 8.4 in this pool only.
env[PATH] = /opt/php84/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
env[PHPRC] = /opt/php84/etc/php.ini
env[PHP_INI_SCAN_DIR] = /opt/php84/etc/conf.d
; Only explicitly scoped preview variables cross clear_env=yes.
env[APP_ENV] = $PORTING_APP_ENV
env[APP_DEBUG] = $PORTING_APP_DEBUG
env[WAREXO_USER_ASSET_DIR] = /workspace/warexo-port/web
env[DB_HOST] = $PORTING_DB_HOST
env[DB_PORT] = $PORTING_DB_PORT
env[DB_NAME] = $PORTING_DB_NAME
env[DB_USER] = $PORTING_DB_USER
env[DB_PASSWORD] = $PORTING_DB_PASSWORD
env[WAREXO_SECRET] = $PORTING_APP_SECRET
env[MAILER_HOST] = mailpit
env[MAILER_TRANSPORT] = smtp
