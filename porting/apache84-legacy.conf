Listen 8084
<VirtualHost *:8084>
    ServerName warexo-porting
    # The clean aggrowawi Git checkout is served only through PHP 8.4. The deployed PHP 7.4 clone stays on port 80.
    # This path is never populated or modified by the porting initializer.
    DocumentRoot /workspace/repos/aggrowawi-php84/web
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    <Directory /workspace/repos/aggrowawi-php84/web>
        AllowOverride None
        Options +FollowSymLinks -Indexes
        Require all granted
        DirectoryIndex app.php
        FallbackResource /app.php
    </Directory>

    Alias /__warexo_porting_health /opt/warexo/porting/health.php
    <Directory /opt/warexo/porting>
        AllowOverride None
        Options None
        Require all denied
        <Files health.php>
            Require all granted
        </Files>
    </Directory>

    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/warexo-php84.sock|fcgi://localhost/"
    </FilesMatch>
    <LocationMatch "^/(install|app_dev|restore)(\.php|/|$)">
        Require all denied
    </LocationMatch>
    # Legacy app.php can execute doctrine:schema:update via /updates/composer.
    # Do not expose that path on the isolated PHP 8.4 preview.
    <LocationMatch "(^|/)updates(?:\.php|/|$)">
        Require all denied
    </LocationMatch>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
