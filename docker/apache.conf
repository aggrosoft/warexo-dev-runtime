<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/web

    # Runtime readiness does not execute copied application code.
    Alias /__warexo_runtime_health /var/lib/warexo/health/ready.txt
    <Directory /var/lib/warexo/health>
        Require all granted
    </Directory>

    # The clone gateway preserves the protocol from Coolify's TLS proxy.
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    <Directory /var/www/html/web>
        AllowOverride All
        Options FollowSymLinks
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

