name: Build runtime image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      needs_image_build: ${{ steps.image_changes.outputs.needs_image_build }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate shell syntax
        run: |
          bash -n docker/entrypoint.sh
          for script in bin/*; do bash -n "$script"; done
          bash -n tests/test-clone-integration.sh
          bash -n porting/entrypoint.sh
          for script in porting/bin/*; do bash -n "$script"; done
          bash -n tests/test-porting-integration.sh

      - name: Run clone and bootstrap unit tests
        run: |
          python3 -m pip install 'PyYAML>=6,<7'
          python3 -m unittest discover -s tests -v
          python3 -m compileall -q clone
          python3 -m compileall -q porting

      - name: Validate Coolify Compose template
        run: |
          WAREXO_GIT_URL=ssh://dev@example.invalid/repo.git \
          WAREXO_GIT_PRIVATE_KEY=dummy \
          docker compose -f compose.coolify.example.yaml config >/dev/null

      - name: Validate clone Compose template
        env:
          SOURCE_SSH_HOST: source.example.invalid
          SOURCE_SSH_USER: example
          SOURCE_SSH_PRIVATE_KEY: dummy-validation-only
          SOURCE_SSH_KNOWN_HOSTS: dummy-validation-only
          SOURCE_WAREXO_PATH: /srv/warexo
        run: docker compose -f compose.clone.coolify.example.yaml config >/dev/null

      - name: Validate optional porting templates
        env:
          SOURCE_SSH_HOST: source.example.invalid
          SOURCE_SSH_USER: example
          SOURCE_SSH_PRIVATE_KEY: dummy-validation-only
          SOURCE_SSH_KNOWN_HOSTS: dummy-validation-only
          SOURCE_WAREXO_PATH: /srv/warexo
        run: |
          docker compose -f compose.clone.coolify.example.yaml -f compose.porting.override.yaml config >/dev/null
          docker compose -f compose.clone.porting.coolify.example.yaml config >/dev/null

      - name: Detect changes requiring an image build
        id: image_changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # A PR changing only Compose, tests or docs uses published images.
          # Source/image changes retain the full build and isolation checks.
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            echo 'needs_image_build=true' >> "$GITHUB_OUTPUT"
          else
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            if git diff --name-only FETCH_HEAD HEAD | grep -Eq '^Dockerfile($|\.)|^\.dockerignore$|^(docker|clone|porting|bin)/'; then
              echo 'needs_image_build=true' >> "$GITHUB_OUTPUT"
            else
              echo 'needs_image_build=false' >> "$GITHUB_OUTPUT"
            fi
          fi

  build:
    needs: validate
    if: needs.validate.outputs.needs_image_build == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/aggrosoft/warexo-dev-runtime
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build runtime for integration tests
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: warexo-runtime:test
          labels: ${{ steps.meta.outputs.labels }}

      - name: Validate PHP helper
        run: docker run --rm --entrypoint php warexo-runtime:test -l /opt/warexo/clone/source_database.php

      - name: Verify SSH clone lifecycle and isolation
        env:
          WAREXO_RUNTIME_IMAGE: warexo-runtime:test
        run: bash tests/test-clone-integration.sh

      - name: Build optional dual-PHP image and dependency proxy
        run: |
          docker buildx build --builder default --load --build-arg BASE_IMAGE=warexo-runtime:test \
            -f Dockerfile.porting -t warexo-runtime:porting-test .
          docker buildx build --builder default --load \
            -f Dockerfile.porting-proxy -t warexo-runtime:porting-proxy-test .

      - name: Verify optional dual-PHP lifecycle and isolation
        env:
          WAREXO_RUNTIME_IMAGE: warexo-runtime:test
          WAREXO_PORTING_IMAGE: warexo-runtime:porting-test
          WAREXO_PORTING_PROXY_IMAGE: warexo-runtime:porting-proxy-test
          WAREXO_TEST_PORTING: "1"
        run: bash tests/test-clone-integration.sh

      - name: Publish verified image
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag warexo-runtime:test "$tag"
            docker push "$tag"
            docker tag warexo-runtime:porting-test "${tag}-porting"
            docker push "${tag}-porting"
            docker tag warexo-runtime:porting-proxy-test "${tag}-porting-proxy"
            docker push "${tag}-porting-proxy"
          done <<< "$IMAGE_TAGS"

  # Compose-only PRs still exercise the real clone/porting lifecycle, but do
  # not recompile PHP 8.4 for files that never enter an image.
  integration_existing_images:
    needs: validate
    if: github.event_name == 'pull_request' && needs.validate.outputs.needs_image_build == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull published runtime and porting images
        run: |
          docker pull ghcr.io/aggrosoft/warexo-dev-runtime:main
          docker pull ghcr.io/aggrosoft/warexo-dev-runtime:main-porting
          docker pull ghcr.io/aggrosoft/warexo-dev-runtime:main-porting-proxy
          docker tag ghcr.io/aggrosoft/warexo-dev-runtime:main warexo-runtime:test
          docker tag ghcr.io/aggrosoft/warexo-dev-runtime:main-porting warexo-runtime:porting-test
          docker tag ghcr.io/aggrosoft/warexo-dev-runtime:main-porting-proxy warexo-runtime:porting-proxy-test

      - name: Verify SSH clone lifecycle and isolation
        env:
          WAREXO_RUNTIME_IMAGE: warexo-runtime:test
        run: bash tests/test-clone-integration.sh

      - name: Verify optional dual-PHP lifecycle and isolation
        env:
          WAREXO_RUNTIME_IMAGE: warexo-runtime:test
          WAREXO_PORTING_IMAGE: warexo-runtime:porting-test
          WAREXO_PORTING_PROXY_IMAGE: warexo-runtime:porting-proxy-test
          WAREXO_TEST_PORTING: "1"
        run: bash tests/test-clone-integration.sh
